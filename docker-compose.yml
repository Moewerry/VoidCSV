services:
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      UPLOAD_DIR: /data/uploads
      SESSION_MAX_AGE_MS: "7200000"
      CLEANUP_INTERVAL_MS: "600000"
      FILE_MAX_AGE_MS: "21600000"
      MAX_UPLOAD_DIR_BYTES: "4294967296"
    volumes:
      - engine-uploads:/data/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "18080:80"
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  engine-uploads:
